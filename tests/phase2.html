<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 2 — maths-editor host element test harness</title>
  <link rel="stylesheet" href="../maths-editor.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.5;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
      background: #f5f5f5;
    }

    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.875rem;
      color: #374151;
    }

    maths-editor {
      --me-font-size: 0.9375rem;
      --me-min-height: 4rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    button {
      padding: 0.35rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #f9fafb;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: #e5e7eb; }
    button:active { background: #d1d5db; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .status-pill {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 600;
      font-size: 0.8125rem;
    }

    .status-pill.is-readonly {
      background: #fee2e2;
      color: #991b1b;
    }

    pre {
      margin: 0;
      padding: 0.5rem 0.75rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 0.8125rem;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 2.5rem;
      max-height: 12rem;
      overflow-y: auto;
    }

    #event-log { color: #374151; }
    .log-input  { color: #1d4ed8; }
    .log-change { color: #7c3aed; }
  </style>
</head>
<body>

<h1>Phase 2 — maths-editor host element test harness</h1>
<p>Exercises every property, method, and event on the <code>&lt;maths-editor&gt;</code> custom element.</p>

<div class="card">
  <label for="editor">Editor under test</label>
  <maths-editor id="editor" placeholder="Type here…"></maths-editor>

  <div class="controls">
    <button id="btn-focus">Focus</button>
    <button id="btn-blur">Blur</button>
    <button id="btn-clear">Clear</button>
    <button id="btn-readonly">Toggle readonly</button>
    <button id="btn-set-hello">Set "Hello world"</button>
    <button id="btn-set-multi">Set multi-line sample</button>
    <button id="btn-get">Get value (alert)</button>
  </div>

  <div class="status-row">
    Readonly:
    <span id="readonly-pill" class="status-pill">false</span>
  </div>
</div>

<div class="card">
  <h2>Live value (updated on every <code>input</code> event)</h2>
  <pre id="live-value"></pre>
</div>

<div class="card">
  <h2>Event log</h2>
  <pre id="event-log">— no events yet —</pre>
</div>

<script type="module" src="../maths-editor.js"></script>
<script>
  // Elements
  const editor      = document.getElementById('editor');
  const liveValue   = document.getElementById('live-value');
  const eventLog    = document.getElementById('event-log');
  const readonlyPill = document.getElementById('readonly-pill');

  // Keep log from growing unbounded
  const MAX_LOG_LINES = 200;
  let logLines = [];

  function timestamp() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `${hh}:${mm}:${ss}.${ms}`;
  }

  function appendLog(text, cssClass) {
    if (logLines[0] === '— no events yet —') logLines = [];
    logLines.push({ text: `[${timestamp()}] ${text}`, cssClass });
    if (logLines.length > MAX_LOG_LINES) logLines.shift();
    renderLog();
  }

  function renderLog() {
    eventLog.innerHTML = logLines.map(({ text, cssClass }) =>
      `<span class="${cssClass}">${escapeHtml(text)}</span>`
    ).join('\n');
    eventLog.scrollTop = eventLog.scrollHeight;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function syncReadonlyPill() {
    const ro = editor.readonly;
    readonlyPill.textContent = String(ro);
    readonlyPill.classList.toggle('is-readonly', ro);
  }

  // Editor events
  editor.addEventListener('input', (e) => {
    liveValue.textContent = e.detail.value;
    appendLog(`input  — value: ${JSON.stringify(e.detail.value)}`, 'log-input');
  });

  editor.addEventListener('change', (e) => {
    appendLog(`change — value: ${JSON.stringify(e.detail.value)}`, 'log-change');
  });

  // Control panel
  document.getElementById('btn-focus').addEventListener('click', () => {
    editor.focus();
  });

  document.getElementById('btn-blur').addEventListener('click', () => {
    editor.blur();
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    editor.clear();
    liveValue.textContent = '';
    syncReadonlyPill();
  });

  document.getElementById('btn-readonly').addEventListener('click', () => {
    editor.readonly = !editor.readonly;
    syncReadonlyPill();
  });

  document.getElementById('btn-set-hello').addEventListener('click', () => {
    editor.value = 'Hello world';
    liveValue.textContent = editor.value;
    syncReadonlyPill();
  });

  document.getElementById('btn-set-multi').addEventListener('click', () => {
    editor.value = 'Line one\nLine two\nLine three';
    liveValue.textContent = editor.value;
    syncReadonlyPill();
  });

  document.getElementById('btn-get').addEventListener('click', () => {
    alert(JSON.stringify(editor.value));
  });

  // Initialise displays
  syncReadonlyPill();
</script>
</body>
</html>
