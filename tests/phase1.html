<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths Editor — Smoke Test</title>
  <!--
    mathlive-static.css provides all component styles and @font-face rules.
    Font URLs inside the stylesheet are relative to this CSS file's location
    (vendor/), so vendor/fonts/ is resolved correctly with no overrides.
    The stylesheet also injects --ML__static-fonts:true into :root, which
    suppresses MathLive's own dynamic FontFace loading — CSS @font-face
    declarations are the sole font-loading path in this configuration.
  -->
  <link rel="stylesheet" href="../vendor/mathlive-static.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 52rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    math-field {
      display: block;
      font-size: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.5rem;
      margin: 0.5rem 0 1.5rem;
    }
    dl { margin: 0; }
    dt { font-weight: bold; margin-top: 0.75rem; }
    dd { margin: 0.25rem 0 0; }
    pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 0;
      padding: 0.5rem 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #btn-copy {
      margin-top: 1.25rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!--
    Script load order is critical:
      1. Compute Engine (CE) registers itself to
         globalThis[Symbol.for("io.cortexjs.compute-engine")] as a side effect
         of its UMD bundle parsing.
      2. MathLive reads that Symbol when getValue('math-json') is called.
    Loading CE after MathLive would mean the Symbol is absent at check time,
    causing getValue('math-json') to return an error expression instead of
    proper MathJSON.
  -->
  <script src="../vendor/compute-engine.min.js"></script>
  <script src="../vendor/mathlive.min.js"></script>

  <!--
    Configuration runs synchronously after both scripts but before <math-field>
    is parsed, so static properties are set before the custom element's
    connectedCallback fires.
  -->
  <script>
    // Suppress sound loading. Without this MathLive requests five .wav files
    // from vendor/sounds/ on every keypress. sounds/ is not vendored.
    MathfieldElement.soundsDirectory = null;
  </script>

  <h1>Maths Editor — Smoke Test</h1>

  <label for="mf">Formula:</label>
  <math-field id="mf">\frac{1}{2} + \int_0^1 x^2 \, dx</math-field>

  <h2>Output</h2>
  <dl>
    <dt>LaTeX</dt>
    <dd><pre id="out-latex"></pre></dd>

    <dt>MathJSON</dt>
    <dd><pre id="out-mathjson"></pre></dd>

    <dt>Spoken text</dt>
    <dd><pre id="out-spoken"></pre></dd>
  </dl>

  <button id="btn-copy" type="button">Copy LaTeX</button>

  <script>
    var mf        = document.getElementById('mf');
    var outLatex  = document.getElementById('out-latex');
    var outJson   = document.getElementById('out-mathjson');
    var outSpoken = document.getElementById('out-spoken');
    var btnCopy   = document.getElementById('btn-copy');

    function updateOutputs() {
      outLatex.textContent  = mf.getValue('latex');
      outJson.textContent   = mf.getValue('math-json');
      outSpoken.textContent = mf.getValue('spoken-text');
    }

    mf.addEventListener('input', updateOutputs);
    updateOutputs();

    btnCopy.addEventListener('click', function () {
      var latex = mf.getValue('latex');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(latex).then(function () {
          btnCopy.textContent = 'Copied!';
          setTimeout(function () { btnCopy.textContent = 'Copy LaTeX'; }, 1500);
        }).catch(function () {
          // navigator.clipboard may be blocked on file:// in some browsers
          alert('LaTeX: ' + latex);
        });
      } else {
        alert('LaTeX: ' + latex);
      }
    });
  </script>

</body>
</html>
